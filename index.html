<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ДЕСЕТ | Дигитален вестник</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e8e8;color:#151515;font-family:Georgia,serif}main{max-width:1100px;margin:auto;background:white;padding:24px}header{text-align:center;border-bottom:5px solid #b90000}h1{font-family:Arial,sans-serif;font-size:clamp(65px,16vw,180px);letter-spacing:-.065em;line-height:.9;margin:15px 0;font-weight:1000}.meta{display:flex;justify-content:space-between;border-block:1px solid;padding:8px;font: bold 12px Arial}nav{display:flex;justify-content:space-between;padding:12px 0;font: bold 13px Arial;gap:8px}button{cursor:pointer;background:white;border:1px solid;padding:6px}#paper{display:grid;grid-template-columns:repeat(4,1fr);gap:0}article{padding:14px;border-bottom:1px solid;border-right:1px solid;cursor:pointer}article:first-child{grid-column:span 3;background:#f4f4f4}article:first-child h2{font-size:clamp(34px,5vw,68px)}article:nth-child(2){background:#b90000;color:white}article:nth-child(2) small{color:white}article:nth-child(5){grid-column:span 2}h2{font-size:27px;line-height:1.05;margin:8px 0}small{font:bold 12px Arial;color:#b90000}p{line-height:1.45}article img{width:100%;max-height:340px;object-fit:cover}footer{padding:20px 0;text-align:center;font:12px Arial}dialog{max-width:700px;width:90%;border:2px solid;padding:25px}dialog h2{font-size:38px}.layout2 article:first-child{grid-column:span 4}.layout3 article:first-child{grid-column:span 2}.layout3 article:nth-child(2){grid-column:span 2}@media(max-width:650px){main{padding:12px}#paper{grid-template-columns:repeat(2,1fr)}#paper article:first-child,#paper article:nth-child(5){grid-column:span 2}h2{font-size:22px}.layout2 article:first-child{grid-column:span 2}}</style><style>@import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@900&family=Roboto+Condensed:wght@800;900&display=swap');header h1,.brand h1{font-family:'Roboto Slab',Georgia,serif;font-weight:900;letter-spacing:-.085em;font-size:clamp(65px,14vw,178px);line-height:1.05;-webkit-text-stroke:1.5px currentColor}.partner strong{font-family:'Roboto Slab',Georgia,serif;font-weight:900;letter-spacing:-.06em;-webkit-text-stroke:.6px currentColor}article h2{font-family:'Roboto Condensed',Arial,sans-serif;font-weight:900;letter-spacing:-.035em;line-height:1.02}article:first-child h2{font-size:clamp(38px,6vw,76px)}@media(max-width:650px){.brand h1{font-size:clamp(80px,23vw,150px)}}</style><main><header><div class="meta"><span>НАЦИОНАЛЕН ДИГИТАЛЕН ВЕСТНИК</span><span>DESETNEWS.COM</span></div><h1>ДЕСЕТ</h1><p>ДЕСЕТ НОВИНИ. ЕДНО ИЗДАНИЕ.</p></header><nav><span id="edition">ДЕМОНСТРАЦИОНЕН БРОЙ</span><button id="layout">Смени оформление</button></nav><section id="paper"></section><footer>ДЕСЕТ • Демонстрационна версия. Заглавията са примерни, не са новини.</footer></main><dialog id="story"><button onclick="document.getElementById('story').close()">Затвори ×</button><h2 id="headline"></h2><p id="body"></p></dialog><script>const samples=[['ВОДЕЩА ТЕМА','Големият въпрос пред България'],['ПОЛИТИКА','Решенията, които предстоят'],['ИКОНОМИКА','Цената на ежедневието'],['ОБЩЕСТВО','Гласът на гражданите'],['РАЗСЛЕДВАНЕ','Документите и въпросите'],['РЕГИОНИ','България извън столицата'],['СВЯТ','Поглед отвъд границите'],['КУЛТУРА','Истории, които остават'],['ИНТЕРВЮ','Десет въпроса към събеседника'],['КОМЕНТАР','Другата гледна точка']].map(([category,title])=>({category,title,summary:'Място за редакционния текст на материала.',body:'Това е демонстрационен материал.'}));const paper=document.getElementById('paper');function render(items){paper.replaceChildren();items.slice(0,10).forEach((a,i)=>{const el=document.createElement('article');el.tabIndex=0;const s=document.createElement('small');s.textContent=String(i+1).padStart(2,'0')+' / '+a.category;const h=document.createElement('h2');h.textContent=a.title;const p=document.createElement('p');p.textContent=a.summary;el.append(s,h);if(a.image){const im=document.createElement('img');im.src=a.image;im.alt=a.title;el.append(im)}el.append(p);const open=()=>{document.getElementById('headline').textContent=a.title;document.getElementById('body').textContent=a.body;document.getElementById('story').showModal()};el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter')open()};paper.append(el)})}render(samples);let layout=0;document.getElementById('layout').onclick=()=>{layout=(layout+1)%3;paper.className=['','layout2','layout3'][layout]};fetch('edition.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{if(d.articles.length===10){render(d.articles);document.getElementById('edition').textContent=d.label}}).catch(()=>{});</script></html>
