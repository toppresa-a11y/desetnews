<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ДЕСЕТ | Редакция</title><style>*{box-sizing:border-box}body{font:16px Arial;background:#eee;color:#171717;margin:0}main{max-width:1000px;margin:auto;background:white;padding:24px}h1{font:bold 72px Georgia;margin:0;border-bottom:6px solid #b90000}input,textarea,button{font:inherit;padding:12px;border:1px solid #aaa;border-radius:4px}input,textarea{width:100%;margin:5px 0 15px}button{cursor:pointer;background:#222;color:white;margin:4px}button.red{background:#b90000}label{display:block;font-weight:bold}textarea{min-height:100px}#body{min-height:260px}#slots{display:flex;flex-wrap:wrap;gap:4px}#slots button.active{background:#b90000}img{max-width:100%;max-height:350px;object-fit:contain}#status{white-space:pre-wrap}dialog{width:90%;max-width:800px;max-height:85vh;overflow:auto} [hidden]{display:none!important}</style><main><h1>ДЕСЕТ</h1><p>Редакционен панел</p><section id="login"><label>Парола<input id="password" type="password" autocomplete="current-password"></label><button id="enter">Вход</button></section><section id="editor" hidden><button id="archiveAdmin">Архив на броевете</button><div id="archiveChoices" hidden></div><label>Име на броя<input id="edition"></label><div id="slots"></div><h2 id="position"></h2><label>Рубрика<input id="category"></label><label>Заглавие<input id="title"></label><label>Подзаглавие<textarea id="summary"></textarea></label><label>Снимка<input type="file" id="file" accept="image/*"></label><img id="photo" hidden><button id="remove">Премахни снимката</button><label>Пълен текст<textarea id="body"></textarea></label><button id="up">Премести нагоре</button><button id="down">Премести надолу</button><hr><button id="save">Запази чернова</button><button id="preview">Преглед</button><button class="red" id="publish">ПУБЛИКУВАЙ БРОЯ</button><button id="logout">Изход</button></section><p id="status" role="status"></p></main><dialog id="view"><button id="close">Затвори</button><div id="previewContent"></div></dialog><script>
const $=id=>document.getElementById(id),keys=['category','title','summary','body'];let password='',data=null,index=0,busy=false;const status=t=>$('status').textContent=t;
async function api(method='GET',payload){const r=await fetch('/api/edition?admin=1',{method,headers:{Authorization:'Bearer '+password,'Content-Type':'application/json'},body:payload?JSON.stringify(payload):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Грешка при връзката');return d}
function sync(){if(!data)return;data.label=$('edition').value;for(const k of keys)data.articles[index][k]=$(k).value}
function show(){const a=data.articles[index];$('edition').value=data.label;$('position').textContent='Материал '+(index+1);for(const k of keys)$(k).value=a[k]||'';$('photo').hidden=!a.image;if(a.image)$('photo').src=a.image;else $('photo').removeAttribute('src');$('file').value='';$('slots').replaceChildren();data.articles.forEach((a,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+(a.category||'Новина');b.className=i===index?'active':'';b.onclick=()=>{if(busy)return;sync();index=i;show()};$('slots').append(b)})}
$('enter').onclick=async()=>{password=$('password').value;try{data=await api();index=0;show();$('login').hidden=true;$('editor').hidden=false;status('Готово за редактиране.')}catch(e){status(e.message)}};
$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;busy=true;try{sync();const img=await createImageBitmap(f);const scale=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);data.articles[index].image=c.toDataURL('image/jpeg',.78);img.close();show();status('Снимката е добавена.')}catch(e){status('Снимката не може да бъде прочетена.')}finally{busy=false}};
$('remove').onclick=()=>{if(busy)return;sync();delete data.articles[index].image;show()};function move(n){if(busy)return;sync();const j=index+n;if(j<0||j>9)return;[data.articles[index],data.articles[j]]=[data.articles[j],data.articles[index]];index=j;show()}$('up').onclick=()=>move(-1);$('down').onclick=()=>move(1);
async function save(publish){if(busy)return;sync();if(publish&&!confirm('Публикуване на целия брой?'))return;busy=true;try{await api('POST',{...data,publish});status(publish?'Броят е публикуван.':'Черновата е запазена.')}catch(e){status(e.message)}finally{busy=false}}$('save').onclick=()=>save(false);$('publish').onclick=()=>save(true);
$('preview').onclick=()=>{sync();const root=$('previewContent');root.replaceChildren();for(const a of data.articles){const h=document.createElement('h2');h.textContent=a.title;root.append(h);if(a.image){const im=document.createElement('img');im.src=a.image;root.append(im)}const p=document.createElement('p');p.textContent=a.summary;root.append(p)}$('view').showModal()};$('close').onclick=()=>$('view').close();$('logout').onclick=()=>{if(confirm('Изход? Незапазените промени ще се загубят.'))location.reload()};
$('archiveAdmin').onclick=async()=>{const root=$('archiveChoices');root.hidden=false;root.textContent='Зареждане…';try{const r=await fetch('/api/archive');if(!r.ok)throw Error();const d=await r.json();root.replaceChildren();if(!d.editions.length)root.textContent='Няма архивирани броеве.';for(const id of d.editions){const b=document.createElement('button');b.textContent='Зареди '+new Date(Number(id)).toLocaleString('bg-BG',{timeZone:'Europe/Sofia'});b.onclick=async()=>{if(busy||!confirm('Зареждане на стар брой? Незапазените промени ще се загубят.'))return;busy=true;try{const r=await fetch('/api/archive?id='+id);if(!r.ok)throw Error();const old=await r.json();if(old.articles?.length!==10)throw Error();data=old;index=0;show();status('Архивният брой е зареден за редакция. Не е публикуван.')}catch(e){status('Грешка при зареждане.')}finally{busy=false}};root.append(b)}}catch(e){root.textContent='Архивът е недостъпен.'}};</script></html>
